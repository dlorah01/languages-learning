title: "English Mastery Program"
description: >-
  A personalized, systems-based curriculum taking a Spanish-native,
  English-fluent learner from A1 English to native-like intuition —
  pronunciation, grammar, vocabulary, and culture taught as one
  interconnected system, with comparisons across English, Spanish, and French.
author: "French Mastery Program"
lang: en

theme: minima
minima:
  skin: dark

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:basename/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
